name: Manual Render Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping public health endpoints
        env:
          BASE_URL: https://whatsapp-news-bot-3-69qh.onrender.com
        run: |
          set -euo pipefail

          ping_path() {
            local path="$1"
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS \
                --retry 4 \
                --retry-all-errors \
                --retry-delay 10 \
                --connect-timeout 20 \
                --max-time 120 \
                "$BASE_URL$path"; then
                return 0
              fi
              sleep 20
            done
            return 1
          }

          ping_path /ping
          ping_path /health
