name: Keep Render Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render service
        run: |
          set -euo pipefail
          BASE_URL="https://whatsapp-news-bot-3-69qh.onrender.com"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 10 --max-time 45 "$BASE_URL/ping"
          curl -fsS --retry 2 --retry-all-errors --retry-delay 10 --max-time 45 "$BASE_URL/health"
