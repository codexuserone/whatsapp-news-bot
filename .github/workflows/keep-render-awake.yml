name: Keep Render Awake

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render service
        run: |
          set -euo pipefail
          BASE_URL="https://whatsapp-news-bot-3-69qh.onrender.com"
          for path in /ping /health; do
            curl -fsS \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 15 \
              --connect-timeout 20 \
              --max-time 90 \
              "$BASE_URL$path"
          done
