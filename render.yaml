services:
  - type: web
    name: whatsapp-news-bot
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build:server && npm run build:web:static
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: "22"
      - key: DB_PROVIDER
        value: neon
      - key: NEON_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: RUN_MIGRATIONS_ON_START
        value: "false"
      - key: MIGRATIONS_STRICT
        value: "false"
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_URL
        sync: false
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "300000"
      - key: KEEP_ALIVE_TIMEOUT_MS
        value: "20000"
      - key: BASE_URL
        sync: false
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false
      - key: BASIC_AUTH_REALM
        value: "WhatsApp News Bot"
      - key: REQUIRE_BASIC_AUTH
        value: "true"
      - key: BASIC_AUTH_REQUIRE_HTTPS
        value: "true"
      - key: ALLOW_WEAK_BASIC_AUTH
        value: "false"
      - key: ACCESS_ALLOWLIST
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: BASIC_AUTH_MAX_ATTEMPTS
        value: "20"
      - key: BASIC_AUTH_BLOCK_MINUTES
        value: "15"
      - key: HSTS_MAX_AGE_SECONDS
        value: "15552000"
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_PRIVATE_URLS
        value: "false"
      - key: WHATSAPP_SESSION_ID
        value: primary
      - key: WHATSAPP_LEASE_AUTO_TAKEOVER
        value: "false"
      - key: WHATSAPP_LEASE_DEPLOY_TAKEOVER
        value: "false"
      - key: WHATSAPP_LEASE_TTL_MS
        value: "45000"
      - key: WHATSAPP_AUTH_AUTO_CLEAR_CORRUPTION
        value: "false"
      - key: WHATSAPP_AUTH_ALLOW_CLEAR_ESTABLISHED_SESSION
        value: "false"
      - key: WHATSAPP_DEVICE_NAME
        value: Anash Bot
      - key: WHATSAPP_BROWSER_PLATFORM
        value: ubuntu
      - key: WHATSAPP_RESOLVE_LATEST_VERSION
        value: "true"
      - key: WHATSAPP_SYNC_FULL_HISTORY
        value: "false"
      - key: WHATSAPP_PRESENCE_OFFLINE_INTERVAL_MS
        value: "300000"
      - key: WHATSAPP_STATUS_ENABLED
        value: "true"
      - key: WHATSAPP_STATUS_INCLUDE_GROUP_PARTICIPANTS
        value: "true"
      - key: WHATSAPP_STATUS_ALLOW_GROUP_PARTICIPANT_AUDIENCE
        value: "unsafe"
      - key: WHATSAPP_STATUS_INCLUDE_SENDER
        value: "true"
      - key: WHATSAPP_ALLOW_POST_SEND_MEDIA_EDITS
        value: "false"
      - key: WHATSAPP_ALLOW_AUTO_REPLACE_CORRECTIONS
        value: "false"
      - key: FEED_AUTOMATION_ALLOW_NON_IMAGE_MEDIA
        value: "false"
      - key: FEED_AUTOMATION_ALLOW_VIDEO_MEDIA
        value: "true"
      - key: MAX_AUTO_QUEUE_ITEM_AGE_HOURS
        value: "24"
      - key: WHATSAPP_STATUS_AUDIENCE_JIDS
        sync: false
      - key: WHATSAPP_STATUS_AUDIENCE_MODE
        value: auto
      - key: WHATSAPP_STATUS_TEST_AUDIENCE_JIDS
        sync: false
      - key: WHATSAPP_ALLOW_EMPTY_STATUS_AUDIENCE
        value: "false"
      - key: WHATSAPP_MAX_IMAGE_BYTES
        value: "16777216"
      - key: WHATSAPP_MAX_VIDEO_BYTES
        value: "33554432"
      - key: BAILEYS_NEWSLETTER_MEDIA_PATCH
        value: "1"
      - key: WHATSAPP_NEWSLETTER_MEDIA_DIRECT_PATH_PATCH
        value: "true"
    healthCheckPath: /health
    autoDeployTrigger: commit
